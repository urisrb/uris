default: &default
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

development:
  <<: *default

# The test adapter, so a broadcast can be asserted rather than waited for. The
# cable database is still declared in database.yml, so the schema is exercised.
test:
  adapter: test

production:
  <<: *default
