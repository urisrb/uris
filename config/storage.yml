test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

s3:
  service: S3
  bucket: <%= ENV["URIS_STAGING_BUCKET"] %>
  region: <%= ENV.fetch("URIS_STAGING_REGION", "us-east-1") %>
  endpoint: <%= ENV["URIS_STAGING_ENDPOINT"] %>
  access_key_id: <%= ENV["URIS_STAGING_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["URIS_STAGING_SECRET_ACCESS_KEY"] %>
  force_path_style: <%= ENV["URIS_STAGING_ENDPOINT"].present? %>
