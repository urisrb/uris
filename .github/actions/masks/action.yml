name: Check out masks
description: >-
  Clone masksrb/masks with a short-lived App token. The Gemfile takes the client
  gem by path, so bundler cannot resolve without it.

inputs:
  app-id:
    description: A GitHub App installed on masksrb with Contents read.
    required: true
  private-key:
    description: That App's private key.
    required: true
  path:
    description: Where to put the checkout.
    required: true

runs:
  using: composite
  steps:
    - id: token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: masksrb
        repositories: masks

    - shell: bash
      env:
        MASKS_TOKEN: ${{ steps.token.outputs.token }}
        TARGET: ${{ inputs.path }}
      run: |
        rm -rf "$TARGET"
        git clone --depth 1 --quiet \
          "https://x-access-token:$MASKS_TOKEN@github.com/masksrb/masks.git" "$TARGET"
        rm -rf "$TARGET/.git"
