name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  boundary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: No host, domain, or secret may be named here
        run: bin/check-boundary

  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check out masks, which the Gemfile takes by path
        uses: ./.github/actions/masks
        with:
          app-id: ${{ secrets.MASKS_APP_ID }}
          private-key: ${{ secrets.MASKS_APP_PRIVATE_KEY }}
          path: ${{ github.workspace }}/../masks

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check out masks, which the Gemfile takes by path
        uses: ./.github/actions/masks
        with:
          app-id: ${{ secrets.MASKS_APP_ID }}
          private-key: ${{ secrets.MASKS_APP_PRIVATE_KEY }}
          path: ${{ github.workspace }}/../masks

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  lint_js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check out masks, which the Gemfile takes by path
        uses: ./.github/actions/masks
        with:
          app-id: ${{ secrets.MASKS_APP_ID }}
          private-key: ${{ secrets.MASKS_APP_PRIVATE_KEY }}
          path: ${{ github.workspace }}/../masks

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The Ruby schema is the source of truth; the TypeScript is generated from
      # it and committed nowhere, so it has to be produced before typechecking.
      - name: Generate the API layer
        run: |
          bin/rails graphql:dump_schema
          npm run codegen
          npm run build:sdk

      - name: Lint and format
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      opensearch:
        image: opensearchproject/opensearch:2.11.0
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: admin
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9201:9200
        options: >-
          --health-cmd="curl -fs localhost:9200/_cluster/health || exit 1"
          --health-interval=10s --health-timeout=5s --health-retries=20

    steps:
      # The analyzers shell out rather than binding, so the suite needs the same
      # binaries a developer installs through the Brewfile.
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpq-dev libvips libvips-tools poppler-utils tesseract-ocr

      # MinIO takes a command argument, which service containers cannot express.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=things -e MINIO_ROOT_PASSWORD=thingsthings \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/live && break
            sleep 2
          done

      # A superuser bypasses row-level security unconditionally, so connecting as
      # one would make every isolation test pass without proving anything.
      - name: Create the non-superuser application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c \
            "CREATE ROLE things WITH LOGIN PASSWORD 'things' CREATEDB;"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check out masks, which the Gemfile takes by path
        uses: ./.github/actions/masks
        with:
          app-id: ${{ secrets.MASKS_APP_ID }}
          private-key: ${{ secrets.MASKS_APP_PRIVATE_KEY }}
          path: ${{ github.workspace }}/../masks

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://things:things@localhost:5432
          CACHE_DATABASE_URL: postgres://things:things@localhost:5432/things_test_cache
          QUEUE_DATABASE_URL: postgres://things:things@localhost:5432/things_test_queue
          CABLE_DATABASE_URL: postgres://things:things@localhost:5432/things_test_cable
          OPENSEARCH_URL: http://localhost:9201
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: things
          S3_SECRET_ACCESS_KEY: thingsthings
          ENCRYPTION_PRIMARY_KEY: ci_only_primary_key_not_for_real_credentials
          ENCRYPTION_DETERMINISTIC_KEY: ci_only_deterministic_key_not_for_real_use
          ENCRYPTION_KEY_DERIVATION_SALT: ci_only_key_derivation_salt_not_for_real
        run: bin/rails db:test:prepare test

  # A build is the cheapest deploy test there is, and it needs no services.
  # Without it the image stayed broken for four commits.
  image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check out masks, whose client and web halves the image copies in
        uses: ./.github/actions/masks
        with:
          app-id: ${{ secrets.MASKS_APP_ID }}
          private-key: ${{ secrets.MASKS_APP_PRIVATE_KEY }}
          path: .masks

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            masks-client=.masks/client
            masks-web=.masks/web
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
