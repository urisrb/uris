- name: Create the uris deploy directory
  ansible.builtin.file:
    path: "{{ uris_deploy_path }}"
    state: directory
    mode: "0750"

- name: Template the uris compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ uris_deploy_path }}/compose.yml"
    mode: "0640"

- name: Pull the uris images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ uris_deploy_path }}"
  changed_when: false

- name: Start uris
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ uris_deploy_path }}"
  register: uris_up
  changed_when: "'Started' in uris_up.stderr or 'Recreated' in uris_up.stderr or 'Created' in uris_up.stderr"

- name: Wait for uris to answer its health check
  ansible.builtin.command:
    cmd: docker compose exec -T uris curl -fsS http://localhost/up
    chdir: "{{ uris_deploy_path }}"
  register: uris_health
  until: uris_health.rc == 0
  retries: 60
  delay: 5
  changed_when: false
