- name: Create the items deploy directory
  ansible.builtin.file:
    path: "{{ things_deploy_path }}"
    state: directory
    mode: "0750"

- name: Template the items compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ things_deploy_path }}/compose.yml"
    mode: "0640"

- name: Pull the items images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ things_deploy_path }}"
  changed_when: false

- name: Start items
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ things_deploy_path }}"
  register: things_up
  changed_when: "'Started' in things_up.stderr or 'Recreated' in things_up.stderr or 'Created' in things_up.stderr"

- name: Wait for items to answer its health check
  ansible.builtin.command:
    cmd: docker compose exec -T items curl -fsS http://localhost/up
    chdir: "{{ things_deploy_path }}"
  register: things_health
  until: things_health.rc == 0
  retries: 60
  delay: 5
  changed_when: false
