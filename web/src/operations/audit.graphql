query AuditEvents(
  $status: String
  $actor: String
  $feed: ID
  $after: ID
  $limit: Int
) {
  auditEvents(
    status: $status
    actor: $actor
    feed: $feed
    after: $after
    limit: $limit
  ) {
    hasMore
    nextCursor
    nodes {
      id
      actor
      actorName
      via
      told
      feed {
        id
        key
        title
      }
      analysis {
        id
        cause
      }
      workingOn {
        id
        key
        title
      }
      channel
      action
      status
      scope
      remoteIp
      requestId
      durationMs
      detail
      arguments
      createdAt
    }
  }
}
