query Runs($status: String, $after: ID, $limit: Int) {
  runs(status: $status, after: $after, limit: $limit) {
    hasMore
    nextCursor
    nodes {
      id
      kind
      status
      processed
      lines
      error
      startedAt
      finishedAt
      createdAt
      resource {
        id
        key
      }
    }
  }
}

query ContextRuns($kind: String, $status: String, $limit: Int) {
  runs(kind: $kind, status: $status, limit: $limit) {
    nodes {
      id
      kind
      status
      processed
      lines
      error
      startedAt
      finishedAt
      createdAt
    }
  }
}

query RunLog($id: ID!) {
  run(id: $id) {
    id
    status
    lines
    logs
  }
}

subscription RunProgressed {
  runProgressed {
    run {
      id
      status
      processed
      lines
      logs
      startedAt
      finishedAt
    }
  }
}

mutation CancelRun($id: ID!) {
  cancelRun(input: { id: $id }) {
    cancelled
    run {
      id
      status
    }
  }
}
