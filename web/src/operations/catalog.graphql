query Catalog($type: String, $connectedTo: ID, $after: ID, $limit: Int) {
  tenant {
    id
    name
    subdomain
  }
  types {
    type
    count
  }
  feeds(type: $type, connectedTo: $connectedTo, after: $after, limit: $limit) {
    hasMore
    nextCursor
    nodes {
      id
      type
      title
      summary
      thumbnailUrl
      analyzedAt
      createdAt
    }
  }
}

query Search($query: String, $type: String, $after: ID, $limit: Int) {
  search(query: $query, type: $type, after: $after, limit: $limit) {
    hasMore
    nextCursor
    total
    nodes {
      id
      type
      title
      summary
      thumbnailUrl
      analyzedAt
      createdAt
    }
  }
}

query FeedDetail($id: ID!) {
  feed(id: $id) {
    id
    type
    title
    note
    summary
    thumbnailUrl
    analyzedAt
    createdAt
    references {
      id
      locatorKey
      filename
      contentType
      contentUrl
      thumbnailUrl
      analyzedAt
      resource {
        id
        key
        type
      }
    }
  }
}

subscription FeedAnalyzed {
  feedAnalyzed {
    feed {
      id
      type
      title
    }
  }
}

mutation AnalyzeFeed($id: ID!) {
  analyzeFeed(input: { id: $id }) {
    analysis {
      id
      status
    }
  }
}

mutation SplitReference($id: ID!) {
  splitReference(input: { id: $id }) {
    feed {
      id
    }
  }
}

mutation ForgetFeed($id: ID!) {
  forgetFeed(input: { id: $id }) {
    forgotten
    places
  }
}

mutation RenameFeed($id: ID!, $title: String!) {
  renameFeed(input: { id: $id, title: $title }) {
    feed {
      id
      title
    }
  }
}

mutation NoteFeed($id: ID!, $note: String) {
  noteFeed(input: { id: $id, note: $note }) {
    feed {
      id
      note
    }
  }
}
