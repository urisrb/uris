query Catalog($kind: String, $after: ID, $limit: Int) {
  tenant {
    id
    name
    subdomain
  }
  kinds {
    kind
    count
  }
  things(kind: $kind, after: $after, limit: $limit) {
    hasMore
    nextCursor
    nodes {
      id
      kind
      title
      summary
      thumbnailUrl
      analyzedAt
      createdAt
    }
  }
}

query Search($query: String, $kind: String) {
  search(query: $query, kind: $kind) {
    id
    kind
    title
    summary
    thumbnailUrl
    analyzedAt
    createdAt
  }
}

query Thing($id: ID!) {
  thing(id: $id) {
    id
    kind
    title
    summary
    thumbnailUrl
    analyzedAt
    createdAt
    references {
      id
      locatorKey
      filename
      contentType
      contentUrl
      thumbnailUrl
      analyzedAt
      analysis
      resource {
        id
        key
        type
      }
    }
  }
}

subscription ThingAnalyzed {
  thingAnalyzed {
    thing {
      id
      kind
      title
    }
  }
}

mutation AnalyzeThing($id: ID!) {
  analyzeThing(input: { id: $id }) {
    run {
      id
      status
    }
  }
}

mutation SplitReference($id: ID!) {
  splitReference(input: { id: $id }) {
    thing {
      id
    }
  }
}
