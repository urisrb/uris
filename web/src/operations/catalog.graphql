fragment Row on Feed {
  id
  type
  key
  title
  mime
  summary
  thumbnailUrl
  staged
  analyzedAt
  createdAt
  parent {
    id
    title
    key
  }
}

query Catalog(
  $types: [String!]
  $connectedTo: ID
  $topLevel: Boolean
  $after: ID
  $limit: Int
) {
  tenant {
    id
    name
    subdomain
  }
  feeds(
    types: $types
    connectedTo: $connectedTo
    topLevel: $topLevel
    after: $after
    limit: $limit
  ) {
    hasMore
    nextCursor
    nodes {
      ...Row
    }
  }
}

query Types {
  types {
    type
    count
  }
}

query Search($query: String, $types: [String!], $after: ID, $limit: Int) {
  search(query: $query, types: $types, after: $after, limit: $limit) {
    hasMore
    nextCursor
    total
    nodes {
      ...Row
    }
  }
}

fragment Pass on Analysis {
  id
  cause
  status
  error
  said
  steps
  lines
  createdAt
  startedAt
  finishedAt
  durationMs
}

query FeedDetail($id: ID!) {
  feed(id: $id) {
    ...Row
    asked
    note
    keywords
    connectedCount
    parent {
      id
      type
      key
      title
    }
    children {
      ...Row
    }
    connected {
      ...Row
    }
    references {
      id
      role
      locatorKey
      filename
      contentType
      contentUrl
      thumbnailUrl
      analyzedAt
      resource {
        id
        key
        type
      }
    }
    analyses {
      ...Pass
    }
  }
}

query AnalysisLog($id: ID!) {
  analysis(id: $id) {
    id
    status
    lines
    logs
  }
}

subscription FeedAnalyzed {
  feedAnalyzed {
    feed {
      id
      type
      title
    }
  }
}

mutation AnalyzeFeed($id: ID!) {
  analyzeFeed(input: { id: $id }) {
    analysis {
      id
      status
    }
  }
}

mutation SplitReference($id: ID!) {
  splitReference(input: { id: $id }) {
    feed {
      id
    }
  }
}

mutation ForgetFeed($id: ID!) {
  forgetFeed(input: { id: $id }) {
    forgotten
    places
  }
}

mutation RenameFeed($id: ID!, $title: String!) {
  renameFeed(input: { id: $id, title: $title }) {
    feed {
      id
      title
    }
  }
}

mutation NoteFeed($id: ID!, $note: String) {
  noteFeed(input: { id: $id, note: $note }) {
    feed {
      id
      note
    }
  }
}

mutation AskCatalog($question: String!) {
  askCatalog(input: { question: $question }) {
    feed {
      id
      title
    }
    analysis {
      id
      status
      createdAt
    }
  }
}

query Asked($id: ID!) {
  feed(id: $id) {
    id
    title
    connected {
      ...Row
    }
    analyses {
      id
      cause
      status
      error
      said
      turns
      createdAt
      finishedAt
    }
  }
}
