query Catalog($kind: String, $after: ID, $limit: Int) {
  tenant {
    id
    name
    subdomain
  }
  kinds {
    kind
    count
  }
  items(kind: $kind, after: $after, limit: $limit) {
    hasMore
    nextCursor
    nodes {
      id
      kind
      title
      summary
      thumbnailUrl
      analyzedAt
      createdAt
    }
  }
}

query Search($query: String, $kind: String, $after: ID, $limit: Int) {
  search(query: $query, kind: $kind, after: $after, limit: $limit) {
    hasMore
    nextCursor
    total
    nodes {
      id
      kind
      title
      summary
      thumbnailUrl
      analyzedAt
      createdAt
    }
  }
}

query Item($id: ID!) {
  item(id: $id) {
    id
    kind
    title
    note
    summary
    thumbnailUrl
    analyzedAt
    createdAt
    references {
      id
      locatorKey
      filename
      contentType
      contentUrl
      thumbnailUrl
      analyzedAt
      analysis
      resource {
        id
        key
        type
      }
    }
  }
}

subscription ItemAnalyzed {
  itemAnalyzed {
    item {
      id
      kind
      title
    }
  }
}

mutation AnalyzeItem($id: ID!) {
  analyzeItem(input: { id: $id }) {
    run {
      id
      status
    }
  }
}

mutation SplitReference($id: ID!) {
  splitReference(input: { id: $id }) {
    item {
      id
    }
  }
}

mutation ForgetItem($id: ID!) {
  forgetItem(input: { id: $id }) {
    forgotten
    places
  }
}

mutation RenameItem($id: ID!, $title: String!) {
  renameItem(input: { id: $id, title: $title }) {
    item {
      id
      title
    }
  }
}

mutation NoteItem($id: ID!, $note: String) {
  noteItem(input: { id: $id, note: $note }) {
    item {
      id
      note
    }
  }
}
